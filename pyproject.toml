[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-cite-check"
version = "0.1.3"
description = "Check that in-text citation numbers in Chinese/mixed academic papers match the numbered bibliography"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hc-ui" }]
keywords = [
  "citation",
  "bibliography",
  "references",
  "academic-writing",
  "thesis",
  "chinese",
  "gbt7714",
  "linter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hc-ui/zh-cite-check"
Repository = "https://github.com/hc-ui/zh-cite-check"
Issues = "https://github.com/hc-ui/zh-cite-check/issues"
Changelog = "https://github.com/hc-ui/zh-cite-check/blob/main/CHANGELOG.md"

[project.scripts]
zh-cite-check = "zh_cite_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
